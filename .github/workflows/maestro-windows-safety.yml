name: E02c Windows PowerShell environment diagnostic
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  environment-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Compare inherited and removed PSModulePath as a standard user
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $name = 'e02diag' + [guid]::NewGuid().ToString('N').Substring(0, 12)
          $password = [Convert]::ToBase64String([Security.Cryptography.RandomNumberGenerator]::GetBytes(32)) + 'Aa1!'
          $secure = ConvertTo-SecureString $password -AsPlainText -Force
          $password = $null
          $user = New-LocalUser -Name $name -Password $secure -PasswordNeverExpires -AccountNeverExpires
          Add-LocalGroupMember -SID 'S-1-5-32-545' -Member $name
          $credential = [PSCredential]::new("$env:COMPUTERNAME\$name", $secure)
          $root = Join-Path $env:PUBLIC "E02Diag-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $root | Out-Null
          & icacls $root /grant "${name}:(OI)(CI)F" | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic grant failed' }
          $script = Join-Path $root 'diagnostic.ps1'
          @'
          $ErrorActionPreference = 'Stop'
          "WINDOWS_POWERSHELL_VERSION=$($PSVersionTable.PSVersion)"
          "CHILD_PSModulePath=$env:PSModulePath"
          $token = whoami /all | Out-String
          $token
          if ($token -notmatch 'S-1-16-8192' -or $token -match 'S-1-5-32-544|SeBackupPrivilege|SeRestorePrivilege') {
              throw 'Diagnostic requires standard medium token without bypass privileges'
          }
          try {
              Import-Module Microsoft.PowerShell.Security -Force -ErrorAction Stop
              'IMPORT_MODULE_SUCCESS'
              exit 0
          } catch {
              'IMPORT_MODULE_FAILURE'
              $Error[0] | Format-List * -Force | Out-String | Write-Output
              exit 1
          }
          '@ | Set-Content $script -Encoding utf8
          $evidence = Join-Path $pwd 'environment-evidence'
          New-Item -ItemType Directory $evidence | Out-Null
          $original = $env:PSModulePath
          "PARENT_INHERITED_PSModulePath=$original" | Set-Content (Join-Path $evidence 'parent.txt')
          $env:TEMP = $root
          $env:TMP = $root
          try {
              $windowsPowerShell = "$env:SystemRoot\System32\WindowsPowerShell\v1.0\powershell.exe"
              $a = Start-Process -FilePath $windowsPowerShell -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $script) -WorkingDirectory $root -Credential $credential -LoadUserProfile -Wait -PassThru -RedirectStandardOutput (Join-Path $evidence 'inherited.stdout.txt') -RedirectStandardError (Join-Path $evidence 'inherited.stderr.txt')
              "INHERITED_EXIT=$($a.ExitCode)" | Tee-Object (Join-Path $evidence 'exits.txt') | Out-Host
              Get-Content (Join-Path $evidence 'inherited.stdout.txt'), (Join-Path $evidence 'inherited.stderr.txt') | Out-Host
              Remove-Item Env:PSModulePath
              $b = Start-Process -FilePath $windowsPowerShell -ArgumentList @('-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass', '-File', $script) -WorkingDirectory $root -Credential $credential -LoadUserProfile -Wait -PassThru -RedirectStandardOutput (Join-Path $evidence 'removed.stdout.txt') -RedirectStandardError (Join-Path $evidence 'removed.stderr.txt')
              "REMOVED_EXIT=$($b.ExitCode)" | Tee-Object (Join-Path $evidence 'exits.txt') -Append | Out-Host
              Get-Content (Join-Path $evidence 'removed.stdout.txt'), (Join-Path $evidence 'removed.stderr.txt') | Out-Host
              if ($a.ExitCode -ne 1 -or $b.ExitCode -ne 0) { throw 'Module-path hypothesis not confirmed' }
          } finally {
              $env:PSModulePath = $original
              Remove-LocalUser -Name $name
              Get-CimInstance Win32_UserProfile | Where-Object SID -eq $user.SID.Value | Remove-CimInstance
              Remove-Item $root -Recurse -Force
          }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: windows-powershell-environment-${{ github.sha }}
          path: environment-evidence/
