name: Maestro native safety

on:
  pull_request:
    branches: [build/patched-0.20.4, build/lbug-0.20.4-cmake-reuse, fix/e03b-source-default]
  push:
    branches: [build/patched-0.20.4, build/lbug-0.20.4-cmake-reuse]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-default:
    name: source-default (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select the preinstalled Rust toolchain
        shell: bash
        run: rustup default stable
      - name: Activate the built-in Visual Studio DeveloperShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }
      - name: Check the explicit lint-only no-link accommodation
        if: runner.os != 'Windows'
        shell: bash
        env:
          DOCS_RS: '1'
          LBUG_PRECOMPILED_SOURCE: lint-only
          LBUG_PRECOMPILED_LIBRARY_DIR: ''
        run: cargo check --locked --no-default-features --all-targets
      - name: Check the explicit lint-only no-link accommodation on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          DOCS_RS: '1'
          LBUG_PRECOMPILED_SOURCE: lint-only
          LBUG_PRECOMPILED_LIBRARY_DIR: ''
        run: cargo check --locked --no-default-features --all-targets
      - name: Prove the historical downloader trips the network trap
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/lbug-downloader-control" 575d94fbd1afc4fbebe5a9a2332c6be0d9dcdc49
          if python scripts/test_source_default.py --repository "$RUNNER_TEMP/lbug-downloader-control" --evidence "$RUNNER_TEMP/source-default-red"; then
            echo "Historical downloader unexpectedly passed"
            exit 1
          fi
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"source-default-red/attempt-count.txt"; assert int(p.read_text()) > 0'
      - name: Prove the historical downloader trips the network trap on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $control = Join-Path $env:RUNNER_TEMP 'lbug-downloader-control'
          $evidence = Join-Path $env:RUNNER_TEMP 'source-default-red'
          git worktree add --detach $control 575d94fbd1afc4fbebe5a9a2332c6be0d9dcdc49
          if ($LASTEXITCODE -ne 0) { throw 'Could not create historical control' }
          python scripts/test_source_default.py --repository $control --evidence $evidence
          if ($LASTEXITCODE -eq 0) { throw 'Historical downloader unexpectedly passed' }
          python -c 'import os,pathlib; p=pathlib.Path(os.environ["RUNNER_TEMP"])/"source-default-red/attempt-count.txt"; assert int(p.read_text()) > 0'
          if ($LASTEXITCODE -ne 0) { throw 'Historical downloader did not trip the network trap' }
      - name: Build and run an external source-default consumer
        if: runner.os != 'Windows'
        shell: bash
        run: python scripts/test_source_default.py --evidence "$RUNNER_TEMP/source-default-green"
      - name: Build and run an external source-default consumer on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: python scripts/test_source_default.py --evidence "$env:RUNNER_TEMP/source-default-green"
      - name: Keep transcripts and network attempt counters
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-default-${{ matrix.os }}-${{ github.sha }}
          path: |
            ${{ runner.temp }}/source-default-red
            ${{ runner.temp }}/source-default-green
          if-no-files-found: error

  native-safety:
    name: native-safety (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
      CMAKE_BUILD_PARALLEL_LEVEL: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Select the preinstalled Rust toolchain
        shell: bash
        run: rustup default stable
      - name: Activate the built-in Visual Studio DeveloperShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }
      - name: Configure native tests from this revision
        run: cmake -S tests/native_safety -B target/native-safety -DCMAKE_BUILD_TYPE=Release
      - name: Build native tests
        run: cmake --build target/native-safety --config Release --parallel 3
      - name: Run native tests (Windows proves closed refusal)
        run: ctest --test-dir target/native-safety --build-config Release --verbose --output-on-failure
      - name: Rust constructor tests using the same source-built archive (Unix)
        if: runner.os != 'Windows'
        shell: bash
        env:
          LBUG_LIBRARY_DIR: ${{ github.workspace }}/target/native-safety/engine/src
          LBUG_INCLUDE_DIR: ${{ github.workspace }}/lbug-src/src/include
        run: |
          export CXXFLAGS="-DLBUG_BUNDLED -I$PWD/target/native-safety/engine/src/include"
          cargo test --release --locked --no-default-features native_safety_tests
      - name: Rust constructor tests using the same archive (Windows refusal)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # The engine's Windows LIBRARY_OUTPUT_PATH uses the top-level CMAKE_BINARY_DIR.
          $env:LBUG_LIBRARY_DIR = "$pwd/target/native-safety/src/Release"
          if (!(Test-Path "$env:LBUG_LIBRARY_DIR/lbug.lib")) { throw 'Source-built lbug.lib is missing' }
          $env:LBUG_INCLUDE_DIR = "$pwd/lbug-src/src/include"
          $env:CXXFLAGS = "/DLBUG_BUNDLED /I$pwd/target/native-safety/engine/src/include"
          cargo test --release --locked --no-default-features native_safety_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # Red proof for the Windows capability-acquisition guard, then restore green.
          $source = 'lbug-src/src/common/file_system/root_directory.cpp'
          $old = 'throw IOException("Restricted root capability is unsupported on Windows (E02).");'
          $new = 'return std::shared_ptr<RootDirectory>(new RootDirectory());'
          try {
            $text = Get-Content -Raw $source
            if (!$text.Contains($old)) { throw 'Windows refusal mutation did not match' }
            [System.IO.File]::WriteAllText((Join-Path $pwd $source), $text.Replace($old, $new))
            cmake --build target/native-safety --config Release --parallel 3
            if ($LASTEXITCODE -ne 0) { throw 'Windows mutant did not build' }
            $native = ctest --test-dir target/native-safety --build-config Release --verbose --output-on-failure 2>&1
            $nativeExit = $LASTEXITCODE
            $native | Tee-Object windows-native-mutant.txt
            if ($nativeExit -ne 8 -or !($native -match 'FAIL windows fails closed')) { throw 'Native Windows mutant survived' }
            cargo clean -p lbug --release
            if ($LASTEXITCODE -ne 0) { throw 'Could not invalidate the reused Rust archive' }
            $rust = cargo test --release --locked --no-default-features native_safety_tests 2>&1
            $rustExit = $LASTEXITCODE
            $rust | Tee-Object windows-rust-mutant.txt
            if ($rustExit -ne 101 -or !($rust -match 'restricted_mode_fails_closed_on_windows .*FAILED')) { throw 'Rust Windows mutant survived' }
          } finally {
            git checkout -- $source
          }
          cmake --build target/native-safety --config Release --parallel 3
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ctest --test-dir target/native-safety --build-config Release --verbose --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo clean -p lbug --release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --release --locked --no-default-features native_safety_tests
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Format Rust bindings
        run: cargo fmt --check
      - name: Native operation audit
        shell: bash
        run: bash scripts/audit-native-filesystem.sh > native-filesystem-audit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-safety-${{ matrix.os }}-${{ github.sha }}
          path: |
            target/native-safety/Testing/Temporary/LastTest.log
            native-filesystem-audit.txt
            windows-*-mutant.txt

  native-cache:
    name: native-cache (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: 3
      PYTHON: python
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Select the preinstalled Rust toolchain
        shell: bash
        run: rustup default stable
      - name: Activate the built-in Visual Studio DeveloperShell
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $before = @{}
          Get-ChildItem Env: | ForEach-Object { $before[$_.Name] = $_.Value }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $install = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          Import-Module (Join-Path $install 'Common7/Tools/Microsoft.VisualStudio.DevShell.dll')
          Enter-VsDevShell -VsInstallPath $install -SkipAutomaticLocation -DevCmdArguments '-arch=x64 -host_arch=x64'
          Get-ChildItem Env: | Where-Object { $before[$_.Name] -ne $_.Value } | ForEach-Object {
            "$($_.Name)=$($_.Value)" >> $env:GITHUB_ENV
          }
      - name: Prove E01b library-directory freshness and complete environment tracking
        shell: bash
        run: python tests/native-cache/test_build_environment.py --evidence "$RUNNER_TEMP/native-cache/build-environment"
      - name: Prove the standard runner environment never triggers an arbitrary-file bypass
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-cache"
          cargo test --locked --manifest-path tests/native-cache/Cargo.toml two_target_directories_reuse_complete_output -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/native-cache/normal-environment.log"
          python - <<'PY'
          import os
          from pathlib import Path
          text = (Path(os.environ['RUNNER_TEMP']) / 'native-cache/normal-environment.log').read_text()
          assert 'native-cache environment:' in text, 'missing per-variable presence table'
          assert 'native cache disabled by ' not in text, 'standard runner triggered an arbitrary-file bypass'
          if os.environ['RUNNER_OS'] == 'Windows':
              assert 'cache ownership cannot be verified on this platform; building from source' in text
              assert 'native cache hit:' not in text and 'native cache published:' not in text
          else:
              assert 'native cache hit:' in text and 'native cache published:' in text
          PY
      - name: Check engine/bridge/dependency compile accounting with a real compiler
        if: runner.os != 'Windows'
        run: python tests/native-cache/test_observer.py
      - name: Exercise the real build script with a counted miniature CMake engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/native-cache"
          cargo test --locked --manifest-path tests/native-cache/Cargo.toml -- --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/native-cache/fixture.log"
      - name: Measure full-engine cold/warm builds and unrelated changes
        if: runner.os != 'Windows'
        shell: bash
        run: python scripts/test_native_cache.py --evidence "$RUNNER_TEMP/native-cache/full-engine"
      - name: Keep cache transcripts, compile counts and measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-cache-${{ matrix.os }}-${{ github.sha }}
          path: ${{ runner.temp }}/native-cache
          if-no-files-found: error
